version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: internhub-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - internhub-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: internhub-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/internhub
      - JWT_SECRET=super_secret_jwt_key_internhub_2026_production
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost
    depends_on:
      - mongodb
    volumes:
      - uploads_data:/app/uploads
    networks:
      - internhub-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: internhub-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - internhub-network

volumes:
  mongodb_data:
  uploads_data:

networks:
  internhub-network:
    driver: bridge
